[project]
name = "aria-toolbox"
version = "0.1.0"
description = "A Python toolbox for connecting, streaming, visualizing, and recording from Project Aria Gen 1 glasses."
readme = "README.md"
authors = [
    { name = "XuKristenYan", email = "xkyan3@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "projectaria-tools>=1.5.2a1",
    "projectaria_client_sdk==1.1.0",
    "torch",
    "torchvision",
    "opencv-python",
    "pyyaml>=6.0.3",
    "easydict>=1.13",
]

[project.scripts]
aria-toolbox = "aria_toolbox:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
